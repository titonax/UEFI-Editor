# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["agent/aptio-iv-foundation"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build IFRExtractor WebAssembly
        shell: bash
        run: |
          rustup target add wasm32-wasip1
          git clone --quiet https://github.com/LongSoft/IFRExtractor-RS.git /tmp/ifrextractor-rs
          git -C /tmp/ifrextractor-rs checkout --quiet b1b9b36c00e3209ff0b1d2a76f10cb17e339473d
          sed -i 's/sha256 = "1.6.0"/sha2 = "0.10.9"/' /tmp/ifrextractor-rs/Cargo.toml
          sed -i 's/extern crate sha256;/extern crate sha2;/; s/use sha256::digest;/use sha2::{Digest, Sha256};/' /tmp/ifrextractor-rs/src/main.rs
          sed -i 's/digest(data)/format!("{:x}", Sha256::digest(data))/g' /tmp/ifrextractor-rs/src/main.rs
          cargo build --manifest-path /tmp/ifrextractor-rs/Cargo.toml --release --target wasm32-wasip1
          cp /tmp/ifrextractor-rs/target/wasm32-wasip1/release/ifrextractor.wasm public/ifrextractor.wasm
      - name: Build LZMA WebAssembly
        run: |
          cargo build --manifest-path tools/lzma-wasi/Cargo.toml --release --target wasm32-wasip1
          cp tools/lzma-wasi/target/wasm32-wasip1/release/lzma-decompress.wasm public/lzma-decompress.wasm
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist folder
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
